<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Join Spartan Gym</title>
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="index.html" aria-label="Spartan Gym home">
                <span class="brand-mark" aria-hidden="true">S</span>
                <span class="brand-name">Spartan <span>Gym</span></span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#membership">Membership</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
                <a class="button site-header__cta" href="signUp.html" aria-current="page">Join now</a>
            </nav>
        </div>
    </header>

    <main class="page-shell signup-page">
        <h1>New Member?<br>Let's Get Started!</h1>

        <form id="signUpForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>

            <button type="submit" id = 'signUpBtn'>Sign Up</button>
        </form>
    </main>
    <script src="script.js" type="module"></script>
</body>
</html>
